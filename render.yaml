# Бесплатный хостинг на Render.com (Blueprint): New → Blueprint → выбрать этот репозиторий
services:
  - type: web
    name: tactical-loot-chess
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
